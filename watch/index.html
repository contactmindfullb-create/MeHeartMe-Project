<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Me❤️Me Watch
  </title>


  <style>

    :root {

      --cream: #fffaf4;
      --ink: #251d2b;

      --purple: #4d326f;
      --deep-purple: #24152f;

      --gold: #efa94a;
      --yellow: #ffd83d;

      --rose: #d83a56;

      --night: #130f1b;

      --muted:
        rgba(255,255,255,.68);

    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      color: white;

      background:
        radial-gradient(
          circle at top,
          rgba(103,67,145,.28),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          #181020,
          var(--night)
        );

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    a {
      color: inherit;
    }


    .mono {

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      text-transform: uppercase;

      letter-spacing: .12em;

    }


    /* =====================================================
       PAGE SHELL
    ====================================================== */

    .watch-shell {

      width: min(
        calc(100% - 30px),
        1120px
      );

      margin: 0 auto;

      padding:
        28px 0 70px;

    }


    /* =====================================================
       TOP BAR
    ====================================================== */

    .watch-topbar {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 16px;

      padding-bottom: 22px;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

    }


    .brand {

      font-weight: 900;

      font-size:
        clamp(
          18px,
          4vw,
          26px
        );

    }


    .brand span {

      color:
        var(--yellow);

    }


    .back-link {

      text-decoration: none;

      color:
        rgba(255,255,255,.72);

      font-size: 12px;

    }


    .back-link:hover {

      color: white;

    }


    /* =====================================================
       HERO
    ====================================================== */

    .watch-hero {

      padding:
        clamp(
          44px,
          9vw,
          90px
        )
        0
        42px;

      text-align: center;

    }


    .watch-kicker {

      margin-bottom: 12px;

      color:
        var(--gold);

      font-size: 10px;

    }


    .watch-hero h1 {

      margin:
        0 0 10px;

      font-size:
        clamp(
          42px,
          9vw,
          88px
        );

      line-height: .95;

    }


    .watch-tagline {

      margin: 0;

      color:
        var(--muted);

      font-size:
        clamp(
          15px,
          2.5vw,
          20px
        );

    }


    /* =====================================================
       FEATURED EXPERIENCE
    ====================================================== */

    .featured {

      position: relative;

      overflow: hidden;

      margin-top: 16px;

      padding:
        clamp(
          26px,
          6vw,
          54px
        );

      border:
        1px solid
        rgba(239,169,74,.28);

      border-radius: 24px;

      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(216,58,86,.16),
          transparent 35%
        ),
        radial-gradient(
          circle at 20% 0%,
          rgba(239,169,74,.12),
          transparent 38%
        ),
        rgba(255,255,255,.025);

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.28);

    }


    .featured-label {

      margin-bottom: 16px;

      color:
        var(--gold);

      font-size: 10px;

    }


    .featured h2 {

      max-width: 850px;

      margin:
        0 0 8px;

      font-size:
        clamp(
          34px,
          7vw,
          68px
        );

      line-height: 1;

    }


    .featured-subtitle {

      margin:
        0 0 24px;

      color:
        var(--yellow);

      font-size:
        clamp(
          16px,
          3vw,
          24px
        );

      font-weight: 800;

    }


    .featured-copy {

      max-width: 720px;

      margin:
        0 0 28px;

      color:
        rgba(255,255,255,.76);

      line-height: 1.7;

      font-size: 16px;

    }


    .featured-actions {

      display: flex;

      flex-wrap: wrap;

      gap: 12px;

    }


    .watch-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 52px;

      padding:
        0 22px;

      text-decoration: none;

      border-radius: 12px;

      font-weight: 900;

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;

    }


    .watch-button:hover {

      transform:
        translateY(-2px);

    }


    .watch-button.primary {

      color:
        #2b1803;

      background:
        var(--gold);

      box-shadow:
        0 10px 30px
        rgba(239,169,74,.20);

    }


    .watch-button.secondary {

      color: white;

      border:
        1px solid
        rgba(255,255,255,.18);

      background:
        rgba(255,255,255,.045);

    }


    /* =====================================================
       STORY STATUS
    ====================================================== */

    .story-status {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap: 12px;

      margin-top: 28px;

    }


    .status-card {

      padding: 16px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 14px;

      background:
        rgba(255,255,255,.025);

    }


    .status-card small {

      display: block;

      margin-bottom: 7px;

      color:
        rgba(255,255,255,.52);

      font-size: 9px;

    }


    .status-card strong {

      color: white;

      font-size: 15px;

    }


    /* =====================================================
       SECTION HEADERS
    ====================================================== */

    .section {

      margin-top:
        clamp(
          46px,
          8vw,
          82px
        );

    }


    .section-heading {

      margin-bottom: 20px;

    }


    .section-label {

      color:
        var(--gold);

      font-size: 9px;

    }


    .section-heading h2 {

      margin:
        7px 0 6px;

      font-size:
        clamp(
          26px,
          5vw,
          42px
        );

    }


    .section-heading p {

      max-width: 650px;

      margin: 0;

      color:
        var(--muted);

      line-height: 1.6;

    }


    /* =====================================================
       CATEGORY CARDS
    ====================================================== */

    .category-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;

    }


    .category-card {

      position: relative;

      min-height: 220px;

      padding: 22px;

      display: flex;

      flex-direction: column;

      justify-content:
        flex-end;

      overflow: hidden;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          rgba(77,50,111,.28),
          rgba(19,15,27,.9)
        );

    }


    .category-card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at top right,
          rgba(255,216,61,.10),
          transparent 42%
        );

      pointer-events: none;

    }


    .category-card > * {

      position: relative;

      z-index: 2;

    }


    .category-card .category-type {

      margin-bottom: 7px;

      color:
        var(--gold);

      font-size: 9px;

    }

      margin:
        0 0
